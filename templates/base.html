
<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>🪸 Portfolio.co</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #f3f3f3;

            color: #222;
        }


        /* Header */

        header {

            background: #05993b;

            color: white;

            text-align: center;

            padding: 22px;
        }


        header h2 {

            margin: 0;

            font-size: 28px;
        }


        header p {

            margin: 8px 0 0;
        }


        /* Navigation */

        nav {

            background: white;

            padding: 14px;

            text-align: center;

            box-shadow: 0 2px 5px #ccc;
        }


        nav a {

            text-decoration: none;

            color: #05993b;

            margin: 0 15px;

            font-weight: bold;
        }


        nav a:hover {

            color: #006b29;
        }


        /* Main container */

        .container {

            max-width: 750px;

            margin: 30px auto;

            padding: 0 15px;
        }


        /* Button */

        .btn {

            background: #05993b;

            color: white;

            padding: 10px 18px;

            text-decoration: none;

            border-radius: 6px;

            display: inline-block;
        }


        .btn:hover {

            background: #007d2e;
        }


        /* Form */

        input,
        textarea,
        select {

            width: 100%;

            padding: 11px;

            margin-top: 7px;

            margin-bottom: 15px;

            border: 1px solid #ccc;

            border-radius: 5px;

            font-size: 14px;
        }


        textarea {

            height: 110px;

            resize: vertical;
        }


        button {

            background: #05993b;

            color: white;

            padding: 11px 22px;

            border: none;

            border-radius: 5px;

            cursor: pointer;

            font-size: 15px;
        }


        button:hover {

            background: #007d2e;
        }


        /* Footer */

        footer {

            text-align: center;

            padding: 25px;

            margin-top: 40px;

            color: #777;
        }

    </style>

</head>


<body>


    <!-- Header -->

    <header>

        <h2>🪸 Portfolio.co</h2>

        <p>Build Your Professional Profile</p>

    </header>


    <!-- Navigation -->

    <nav>

        <a href="/">Home</a>

        <a href="/add">Add Profile</a>

    </nav>


    <!-- Page Content -->

    <div class="container">

        {% block content %}

        {% endblock %}

    </div>


    <!-- Footer -->

    <footer>

        © 2026 Portfolio.co

    </footer>


</body>

</html>
